<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonLight</title>
    <link id="favicon" rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="helio-style.css">
</head>
<body data-theme="dark">
    <header id="status-bar">
        <button type="button" id="nav-toggle" class="header-btn" aria-label="Toggle navigation" title="Toggle navigation">☰</button>
        <img id="brand-logo" alt="MoonLight" hidden>
        <span class="brand">MoonLight</span>
        <span id="device-name"></span>
        <span id="sys-stats"></span>
        <span class="spacer"></span>
        <!-- Shown only when a newer stable GitHub release exists for this device's firmware
             (app.js::checkFirmwareUpdate). Click opens the Firmware card with that release
             pre-selected. Hidden by default; never blocks if GitHub is unreachable. -->
        <button type="button" id="fw-update-badge" class="fw-update-badge" hidden></button>
        <span id="ws-dot" class="ws-dot disconnected" title="WebSocket"></span>
        <button type="button" id="reboot-btn" class="header-btn" aria-label="Reboot device" title="Reboot device">⏻</button>
        <button type="button" id="help-toggle" class="header-btn" aria-pressed="false" aria-label="Help" title="Show help">ⓘ</button>
        <button type="button" id="walk-open" class="header-btn" aria-label="MoonWalk" title="MoonWalk: what this device has done and what comes next"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
        <button type="button" id="theme-toggle" class="header-btn" aria-label="Toggle light/dark theme" title="Toggle light/dark theme"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </header>
    <div class="content">
        <nav id="nav"></nav>
        <div id="nav-overlay"></div>
        <div class="main-area">
            <!-- Workspace: the preview beside the module cards on wide screens (.mode-docked),
                 under them (.mode-under) or floating and draggable (.mode-pip) on small screens
                 or when chosen. The mode class is toggled by preview3d.js::setupLayout. -->
            <div class="workspace mode-docked">
                <div class="preview-pane">
                    <!-- Drag handle: only grabbable while floating (a separate element so
                         it never fights the canvas's camera-orbit pointer handler). -->
                    <div class="preview-bar">
                        <span class="preview-grip" title="Drag preview">⠿</span>
                        <!-- Shown only when the device auto-downscales the preview because the
                             WebSocket link can't stream every light fast enough. -->
                        <span id="preview-status" class="preview-status" hidden></span>
                        <span class="preview-bar-spacer"></span>
                        <label for="preview-dot" class="visually-hidden">Dot size</label>
                        <input type="range" id="preview-dot" class="preview-dot" min="0.25" max="1.5" step="0.05" value="1" aria-label="Dot size" title="Dot size">
                        <button type="button" id="preview-record" class="preview-bar-btn" aria-label="Record a GIF of the preview" title="Record three seconds of the preview as a GIF, to show a preset"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg></button>
                        <button type="button" id="preview-numbers" class="preview-bar-btn" aria-label="Toggle LED sequence numbers" title="Show LED sequence numbers (when zoomed in enough to read)">№</button>
                        <button type="button" id="preview-reset" class="preview-bar-btn" aria-label="Reset preview to defaults" title="Reset preview (camera, dot size, numbers, layout)">⌖</button>
                        <button type="button" id="preview-under" class="preview-bar-btn" aria-label="Put the preview under the cards" title="Put the preview under the cards" hidden>⬓</button>
                        <button type="button" id="preview-dock" class="preview-bar-btn" aria-label="Pop preview out or dock" title="Pop preview out / dock">⤢</button>
                        <button type="button" id="preview-close" class="preview-bar-btn" aria-label="Hide preview" title="Hide preview">✕</button>
                    </div>
                    <!-- WebGL point sprites can't draw text; the sequence numbers are a 2D
                         canvas overlay (preview3d.js projects each light to screen space).
                         Same box as #preview, pointer-events:none so orbit still works. -->
                    <canvas id="preview" aria-label="3D preview of the lights"></canvas>
                    <canvas id="preview-labels" aria-hidden="true"></canvas>
                </div>
                <!-- The split between cards and preview: sideways beside the preview, up and down
                     under it, hidden while it floats. preview3d.js::setupLayout drives it. -->
                <div id="cards-resize" class="cards-resize" role="separator" aria-orientation="vertical" aria-label="Resize the module cards and the preview" title="Drag to share the room between the cards and the preview"></div>
                <main id="main"></main>
            </div>
            <!-- Re-show affordance: appears only when the PiP is dismissed. -->
            <button type="button" id="preview-show" class="preview-show" aria-label="Show preview" title="Show preview" hidden>◳ preview</button>
        </div>
    </div>
    <script type="module" src="helio-bootstrap.js"></script>
</body>
</html>
